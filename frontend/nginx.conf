worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  limit_req_zone $binary_remote_addr zone=password_reset_by_ip:10m rate=5r/m;
  limit_req_status 429;

  server {
    listen 80;
    server_name game.anguy.dev;

    location = /healthz.json {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name game.anguy.dev;

    ssl_certificate /etc/letsencrypt/live/game.anguy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.anguy.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'" always;
    add_header Cache-Control "no-store" always;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/password/forgot {
      client_max_body_size 8k;
      limit_req zone=password_reset_by_ip burst=4 nodelay;
      proxy_pass http://backend:8080;
      proxy_redirect off;
    }

    location = /api/auth/google/callback {
      client_max_body_size 32k;
      proxy_pass http://backend:8080;
      proxy_redirect off;
    }

    location /api/ {
      proxy_pass http://backend:8080;
      proxy_redirect off;
    }

    location /ws {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_read_timeout 120s;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
