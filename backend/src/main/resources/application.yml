server:
  port: 8080
  forward-headers-strategy: framework

spring:
  flyway:
    enabled: true
  application:
    name: backend
  datasource:
    # Allow overriding via env vars for container/prod; fallback keeps local dev working.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flip}
    username: ${SPRING_DATASOURCE_USERNAME:flip}
    password: ${SPRING_DATASOURCE_PASSWORD:flip}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:resend}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

app:
  public-url: "${APP_PUBLIC_URL:http://localhost:5173}"
  support-email: "${APP_SUPPORT_EMAIL:support@anguy.dev}"
  mail:
    from: "${APP_MAIL_FROM:Flip Da Table <no-reply@mail.anguy.dev>}"
  auth:
    login:
      max-failures: ${APP_AUTH_LOGIN_MAX_FAILURES:5}
      window-seconds: ${APP_AUTH_LOGIN_WINDOW_SECONDS:900}
    password-reset:
      enabled: ${APP_AUTH_PASSWORD_RESET_ENABLED:false}
    google:
      enabled: ${APP_AUTH_GOOGLE_ENABLED:false}
      client-id: "${GOOGLE_CLIENT_ID:}"
    cleanup-interval-ms: ${APP_AUTH_CLEANUP_INTERVAL_MS:3600000}
  jwt:
    secret: "${APP_JWT_SECRET:change-me-dev}"  # default only for local/dev, override in production
  realtime:
    sse:
      timeout-ms: ${APP_REALTIME_SSE_TIMEOUT_MS:1800000}
      max-per-player: ${APP_REALTIME_SSE_MAX_PER_PLAYER:3}
      max-per-game: ${APP_REALTIME_SSE_MAX_PER_GAME:32}
  las-vegas:
    bot:
      step-delay-ms: ${APP_LAS_VEGAS_BOT_STEP_DELAY_MS:800}
      recovery-interval-ms: ${APP_LAS_VEGAS_BOT_RECOVERY_INTERVAL_MS:5000}
  conquer-westeros:
    bot:
      step-delay-ms: ${APP_CONQUER_WESTEROS_BOT_STEP_DELAY_MS:800}
      recovery-interval-ms: ${APP_CONQUER_WESTEROS_BOT_RECOVERY_INTERVAL_MS:5000}
